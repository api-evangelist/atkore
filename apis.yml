description: >-
  Atkore is a manufacturer of electrical conduit, cable management
  systems, metal framing, and other safety and infrastructure products
  used in commercial, industrial, and residential construction. The
  company offers several end-user technical tools, including the Atkore
  BIM Toolbar (a Revit plugin), Atkore Virtual 3D, and an online Hanger
  Configurator, but does not expose a public REST API or self-service
  developer portal at this time.
